<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8d0045">
<title>A Special Message ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow"></div>
<div id="hearts" aria-hidden="true"></div>

<main class="page">
  <div class="bell-area">
    <p class="hint">🔔 You have a special message</p>
    <button id="bellButton" class="bell-button" aria-label="Open your special message">
      <span class="bell">🔔</span>
      <span class="notification-dot"></span>
    </button>
    <p class="click-text">Click the bell ❤️</p>
  </div>

  <section id="messageCard" class="card hidden">
    <div class="heart-badge">♥</div>
    <h1>You are Special!</h1>
    <div class="divider"><span>♥</span></div>
    <p>Thank you for being<br>a wonderful part of my life.</p>
    <div class="flourish">❧ ♥ ❧</div>
    <button id="closeButton" class="close-button">Close message</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
